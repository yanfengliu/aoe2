name: playtest-corpus-llm
# Per design Codex MED4: this workflow is SEPARATE from playtest.yml
# (the deterministic-AI corpus) so the deterministic gating loop never
# depends on Anthropic availability or API key presence.
#
# KEY-BEARING, SO NO PULL-REQUEST TRIGGER. The run steps below put
# `secrets.ANTHROPIC_API_KEY` in the environment of scripts that execute code
# from the checked-out ref. This repository went public on 2026-09-05, so a
# pull request can now arrive from a stranger's fork, and the `llm-playtest`
# label that used to gate the PR run was NOT a code gate: `synchronize` was in
# the trigger list, so once a maintainer labelled a fork's PR the contributor
# could push a new commit and this key-bearing job would re-run on the new code.
# Only `schedule` and `workflow_dispatch` remain, and both run code that is
# already on a branch of this repository.
#
# Do NOT add `pull_request_target` here. It is the trigger that would make this
# genuinely exploitable: the key AND a write-scoped token, against the base
# repository, on code the contributor controls. It has never appeared anywhere
# in this repository's history and it must not start here.
#
# A pull request still gets its playtest coverage: playtest.yml runs the
# deterministic corpus on every PR, and it needs no secret.
on:
  schedule:
    # Nightly at 04:17 UTC (early morning so a flake doesn't block
    # deterministic CI which runs on every PR push).
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed override (defaults to row from playtest-corpus-llm.json)'
        required: false
        type: string
      max-ticks:
        description: 'maxTicks override'
        required: false
        type: string

# `contents: read` is all this workflow needs. `pull-requests: write` went with
# the PR comment step, which went with the PR trigger.
permissions:
  contents: read

jobs:
  corpus-llm:
    # No `if:` gate any more. The one that was here only ever guarded the
    # pull-request path (label present AND vars.ANTHROPIC_KEY_AVAILABLE), and it
    # evaluated true for every schedule and workflow_dispatch run, so removing
    # it with the PR trigger leaves the remaining two triggers unchanged.
    # Default PR validation does NOT depend on this workflow; playtest.yml
    # (deterministic) is the gating one.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # aoe2 consumes the engine's PREBUILT dist (the engine CI packs it as the
      # rolling engine-dist release); it does not build the engine. See ci.yml.
      - name: Fetch the prebuilt civ-engine
        shell: bash
        run: |
          curl -fsSL -o civ-engine.tgz https://github.com/yanfengliu/civ-engine/releases/download/engine-dist/civ-engine.tgz
          mkdir -p ../civ-engine
          tar -xzf civ-engine.tgz -C ../civ-engine --strip-components=1
      - name: Fetch pinned voxel source
        shell: bash
        run: |
          VOXEL_COMMIT="$(tr -d '[:space:]' < .github/voxel-commit)"
          printf '%s\n' "$VOXEL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test ! -e ../voxel
          mkdir -p ../voxel
          # Relative paths on purpose, -C included: under Git-bash on Windows
          # GNU tar mangles a drive-lettered path, which kept every
          # windows-latest run red for two months.
          curl -fsSL --retry 3 \
            -o voxel.tgz \
            "https://github.com/yanfengliu/voxel/archive/${VOXEL_COMMIT}.tar.gz"
          tar -xzf voxel.tgz \
            -C ../voxel \
            --strip-components=1
          rm -f voxel.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build voxel
        shell: bash
        run: npm --prefix ../voxel ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run LLM corpus (default — reads playtest-corpus-llm.json)
        if: github.event_name != 'workflow_dispatch' || (inputs.seed == '' && inputs.max-ticks == '')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run playtest:corpus-llm
      - name: Run LLM playtest (manual override — bypasses corpus file)
        if: github.event_name == 'workflow_dispatch' && (inputs.seed != '' || inputs.max-ticks != '')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEED: ${{ inputs.seed || 'aoe2-prototype' }}
          MAX_TICKS: ${{ inputs.max-ticks || '5000' }}
        # Single-row override: bypass the corpus aggregator and call the
        # playtest:llm script directly with the dispatch inputs (Codex
        # impl-345 M7). The artifact upload still fires via the same path
        # because we write to the same output dir the corpus runner would;
        # that upload is now the only way a dispatch run reports its result,
        # since the PR comment poster went with the pull_request trigger.
        run: |
          # Phase-6.A.3 timestamped corpus dir: <date>-<HHMMSS> instead
          # of <date> only, so multiple invocations (or the corpus
          # runner running alongside) don't overwrite each other.
          stamp="$(date -u +%Y-%m-%d-%H%M%S)"
          mkdir -p "output/corpus-llm/$stamp"
          mkdir -p output/playtests-llm
          npm run playtest:llm -- --seed "$SEED" --max-ticks "$MAX_TICKS" --out "output/playtests-llm/$stamp-manual"
          # Build a minimal SUMMARY-LLM.md so the uploaded artifact carries a
          # readable result (it used to feed the PR comment poster as well).
          envelope_path="output/playtests-llm/$stamp-manual.envelope.json"
          if [ -f "$envelope_path" ]; then
            stop=$(jq -r '.stopReason' "$envelope_path")
            ticks=$(jq -r '.ticksRun' "$envelope_path")
            cost=$(jq -r '.totalCostUsd' "$envelope_path")
            cat > "output/corpus-llm/$stamp/SUMMARY-LLM.md" <<EOF
          # LLM playtest — manual dispatch (seed=$SEED, maxTicks=$MAX_TICKS)

          | stopReason | ticksRun | totalCost |
          |---|---|---|
          | $stop | $ticks | \$$cost |
          EOF
          fi
      - name: Upload corpus output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-llm-${{ github.run_id }}
          path: |
            output/corpus-llm/
            output/playtests-llm/
      # The "Post SUMMARY-LLM.md to PR" step that used to sit here is gone with
      # the pull_request trigger: its `github.event_name == 'pull_request'`
      # condition can no longer be true, and it was the only reason this
      # workflow asked for `pull-requests: write`. SUMMARY-LLM.md is still
      # written, and now reaches a reader through the artifact above.
      # NOTE ON WHAT THIS ARTIFACT PUBLISHES: it is downloadable by anyone now
      # that the repository is public. The nightly run uses the real API key,
      # so treat the transcripts as public. They are game state, LLM decisions
      # and costs; nothing serializes `process.env`, and the Anthropic provider
      # strips `x-api-key`, headers and request bodies out of SDK errors.
