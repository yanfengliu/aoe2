name: CI

on:
  # EVERY push to main runs the gates. Until 2026-09-24 this trigger carried an
  # `on.push.paths` filter — package.json, the lockfile, .gitattributes,
  # .github/voxel-commit and the workflows — as "cost control" from when Actions
  # minutes were paid. Every user-visible change bumps the version, so what it
  # let through unchecked was every test, tooling, script and docs commit: a
  # red test landed by a tooling commit stayed invisible until the next version
  # bump happened to run the suite, and whoever shipped that bump inherited it.
  #
  # The cost it controlled is gone. The repository went public on 2026-09-05,
  # and standard GitHub-hosted runners cost nothing on a public repository:
  # run 35976155075 (v0.3.228) billed 0 ms on all six jobs, one Windows and five
  # Ubuntu, for 31.7 minutes of wall time and about 87 runner-minutes. What a
  # push costs now is queue time, not money: GitHub's Free plan runs 20
  # standard jobs at once (its Actions limits page, read 2026-09-24), and one
  # run of this workflow takes 6 of them, plus 1 for playtest.yml.
  #
  # Do not reintroduce a paths filter to save time. If the repository goes
  # private again, the filter is the owner's call about money, and it has to
  # come back with a check that says out loud which commits it leaves ungated.
  # `scripts/ci-status.mjs` reads this block at each commit it judges and calls
  # a commit with no run of its own UNGATED unless a later run carried it.
  # tests/scripts/ciTriggers.test.ts fails if a watched workflow filters its
  # push to main.
  #
  # `.nvmrc` still does not steer anything here: both watched workflows pin
  # `node-version:` as a literal (20 here, 22 in playtest.yml) and neither reads
  # the file. Wire `setup-node` to `node-version-file:` before relying on it.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow only reads code. It declares that explicitly because the
# repository went public on 2026-09-05 and the pull_request trigger above now
# runs a stranger's code (`npm ci` install scripts, then the build and test
# scripts from the PR itself). GitHub already hands a fork's pull request a
# read-only token, but stating the floor here also covers the push and dispatch
# runs, whatever the repository's default token permission is set to. This
# workflow uses no secrets.
permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.os }} — typecheck + lint + test ${{ matrix.shard }}/3 + build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the canonical CI target. windows-latest catches the FU8
        # vitest worker RPC quirks documented in vitest.config.ts.
        os: [ubuntu-latest, windows-latest]
        # The unit suite in three slices, one job each (2026-11-05, work 143).
        shard: [1, 2, 3]
    # SHARDED, because one job per runner no longer fit. Unsharded, this job
    # took 38.9-40.2 minutes on windows-latest on every run of 2026-11-05 (667
    # test files, 5,240 tests), 35.2-36.3 of them in the unit-suite step, and
    # run 41990047794 went red at 40.2, past the headroom step's line at two
    # thirds of this limit. Runner speed alone moves it 1.9x: the same 649 files
    # took 19.5 minutes of suite on one Windows runner (run 41806570710) and
    # 36.6 on another (run 39742886323). ubuntu-latest took 22.7-30.0 minutes.
    #
    # `vitest --shard=<k>/<n>` sorts the files by a sha1 of their path and gives
    # each shard a contiguous run of ceil(files/n) of them (BaseSequencer.shard,
    # vitest 3.2), so the split is by file COUNT, not time, and a file lands in
    # the same shard on both runners. It cannot split a file, and time is
    # concentrated: tests/simulation is 90% of it, and four self-play matches
    # are 35% (260-429 s each on that Windows run).
    #
    # More workers per runner was the other lever, and is not taken.
    # vitest.config.ts caps them at half the cores because oversubscription
    # inflated the heaviest tests 3-5x, and the closest tests already run at 45%
    # of their own limits, which the per-test step below fails past 67%. A shard
    # runs its tests on the same runner, with the same workers, as the whole
    # suite did; only the files are fewer.
    #
    # Every shard runs typecheck, lint and build too (75 s on that Windows run),
    # so there is one kind of job and a red one names its own step.
    # tests/scripts/ciJobHeadroom.test.ts holds the shard list, the `--shard`
    # count and this name together, and keeps both runners in the matrix.
    timeout-minutes: 60

    steps:
      # The clock for the headroom step at the end of this job. It is the first
      # step, so it covers every step but "Set up job" and the post-job cleanup
      # (0-4 seconds a job on run 35940039145); see scripts/ci-job-headroom.mjs.
      - name: Start the headroom clock
        shell: bash
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      # The strict seven historical-import bindings read this immutable source.
      # Keep checkout shallow and fetch only the source tree the validators need.
      - name: Fetch historical work-document source
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 143ad5116f25393504328056764bcc8706917b9e
          git cat-file -e 143ad5116f25393504328056764bcc8706917b9e^{commit}

      # aoe2 depends on its sibling engine via `file:../civ-engine` (a symlink
      # to ../civ-engine locally). CI checks out only aoe2, so we fetch the
      # engine's PREBUILT dist — packed + published by the engine's own CI as
      # the rolling `engine-dist` release — and extract it into ../civ-engine so
      # the dep resolves. aoe2 CI does NOT build the engine; that is the engine
      # CI's job. (Public repo asset → no token needed; curl + tar work on the
      # ubuntu + windows/git-bash matrix.)
      - name: Fetch the prebuilt civ-engine
        shell: bash
        run: |
          curl -fsSL -o civ-engine.tgz https://github.com/yanfengliu/civ-engine/releases/download/engine-dist/civ-engine.tgz
          mkdir -p ../civ-engine
          tar -xzf civ-engine.tgz -C ../civ-engine --strip-components=1

      - name: Fetch pinned voxel source
        shell: bash
        run: |
          VOXEL_COMMIT="$(tr -d '[:space:]' < .github/voxel-commit)"
          printf '%s\n' "$VOXEL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test ! -e ../voxel
          mkdir -p ../voxel
          # Relative paths on purpose, -C included: under Git-bash on Windows
          # GNU tar mangles a drive-lettered path, which kept every
          # windows-latest run red for two months.
          curl -fsSL --retry 3 \
            -o voxel.tgz \
            "https://github.com/yanfengliu/voxel/archive/${VOXEL_COMMIT}.tar.gz"
          tar -xzf voxel.tgz \
            -C ../voxel \
            --strip-components=1
          rm -f voxel.tgz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # vitest config FU8 explains why Node 20+ is required (birpc round-trip
          # behavior). Match the local Windows toolchain.
          node-version: '20'
          cache: 'npm'

      - name: Install and build voxel
        shell: bash
        run: npm --prefix ../voxel ci

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build content
        run: npm run content:build

      - name: Build
        run: npm run build

      # This job's shard of the files. npm passes what follows `--` to `vitest
      # run` only, not to the `pretest` voxel build. The `--` is QUOTED for
      # windows-latest, whose default shell is PowerShell: PowerShell drops a
      # bare `--` before npm.ps1 sees it (npm 10.8.2's shim hands node its
      # $args), and npm then keeps `--shard` as a setting of its own and runs
      # every file. Measured 2026-11-05 under Windows PowerShell 5.1 with that
      # shim's logic: bare, the script got no arguments and npm_config_shard
      # was 1/3; quoted, it got --shard=1/3, as it does under bash either way.
      # tests/scripts/ciJobHeadroom.test.ts fails a bare `--` in any npm or npx
      # command a Windows job runs under PowerShell.
      - name: Vitest unit suite
        id: unit-suite
        run: npm test '--' --shard=${{ matrix.shard }}/3
        env:
          # Avoid color output in CI logs.
          FORCE_COLOR: '0'

      # Red when any test used more than two thirds of its OWN time limit, so a
      # test creeping towards its timeout fails here with its numbers before a
      # slower runner times it out. It reads the report vitest.config.ts's
      # reporter writes, which holds this shard's tests and no others (a shard
      # is a job, on a runner of its own). It runs after a failed suite too, to
      # print the ranking beside the failure; not when an earlier step failed
      # and the suite never ran, where it could only say that no report exists.
      # See scripts/test-time-headroom.mjs.
      - name: Headroom under each test's time limit
        if: ${{ !cancelled() && steps.unit-suite.outcome != 'skipped' }}
        run: node scripts/test-time-headroom.mjs tmp/test-times/vitest.json

      # Red past two thirds of timeout-minutes, so a job creeping towards its
      # limit fails with its numbers before the limit cancels it with none.
      # tests/scripts/ciJobHeadroom.test.ts holds this number equal to the
      # job's timeout-minutes. It runs after a failed step too, so a red
      # per-test verdict above does not hide the job's own numbers.
      - name: Headroom under the job's time limit
        if: ${{ !cancelled() }}
        run: node scripts/ci-job-headroom.mjs --limit-minutes 60

  # Half of `npm run verify` had never run remotely. The gate is
  # `content:validate && test && typecheck && test:browser && lint && build`;
  # the job above runs everything except `test:browser`, and nothing in this
  # repository installed a browser outside the nightly LLM workflow (deleted
  # 2026-09-25, when the owner retired it). So every
  # spec under tests/browser/ existed only as something ONE developer machine
  # had run — and on 2026-09-06 that machine was shown to be unrepresentative:
  # `tests/scripts/ciStatus.test.ts` passed there and failed on a clean Windows
  # runner, because a local tree written by editors never sees the CRLF checkout
  # a fresh clone gets. Every browser spec was in that same position.
  browser:
    name: ubuntu-latest — browser suite ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest

    # SEPARATE jobs, SHARDED, on ONE platform. All three are deliberate.
    #
    # Separate, because the `gates` matrix already needed its cap raised from
    # 30m to 60m for the Windows leg. A job of its own runs in PARALLEL, so the
    # workflow still finishes when its slowest leg does.
    #
    # Sharded (2026-09-23). The comment here used to say the suite takes 14-17
    # minutes; that was the local Windows number. On this runner, as one job,
    # the suite step took 37.9-43.7 minutes on every run from 2026-09-06 to
    # 2026-09-23 except one (33.9), against this job's 45-minute limit, and run
    # 35896557214 was cancelled at the limit. The spread was the runner, not the
    # suite: the same specs measured 33.6 and 43.3 minutes on two runners, every
    # spec file slower by 1.12x-1.42x. Playwright's `--shard` splits the spec
    # files into contiguous runs of equal TEST COUNT (runner/testGroups.js in
    # 1.59), and on the slower run's per-file times four shards take 10.4, 11.8,
    # 9.7 and 11.6 minutes of tests, plus about 1.5 minutes of setup and build
    # each. Four rather than three (16.2 minutes at worst) for room to grow: the
    # headroom step fails a shard past 30 minutes, two thirds of 45, which three
    # shards reach when the tests grow 1.8x and four at 2.4x. The shard count is
    # `strategy.job-total`, so the matrix and the split cannot disagree.
    # Standard runners cost nothing on a public repository (this one since
    # 2026-09-05; run 35896557214's billable time was 0 ms).
    #
    # ubuntu-latest only. Windows is the platform the suite is LEAST unproven
    # on: `npm run verify` on the one Windows development machine has run it
    # before every code commit for months, and Linux is where these specs had
    # never executed once. What this leaves unproven is stated plainly: a
    # Chromium behaviour that differs between the Linux runner and Windows is
    # not covered here, only locally.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 45

    # Checkout/engine/voxel/node below are copied from `gates`. Duplicated
    # rather than factored into a composite action because `.github/actions/`
    # does not exist, creating it is a structural change this job does not need,
    # and tests/architecture/workflowSecretExposure.test.ts records its absence
    # as a bound on what that gate can see. Factor when a third job wants them.
    steps:
      - name: Start the headroom clock
        shell: bash
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the prebuilt civ-engine
        shell: bash
        run: |
          curl -fsSL -o civ-engine.tgz https://github.com/yanfengliu/civ-engine/releases/download/engine-dist/civ-engine.tgz
          mkdir -p ../civ-engine
          tar -xzf civ-engine.tgz -C ../civ-engine --strip-components=1

      - name: Fetch pinned voxel source
        shell: bash
        run: |
          VOXEL_COMMIT="$(tr -d '[:space:]' < .github/voxel-commit)"
          printf '%s\n' "$VOXEL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test ! -e ../voxel
          mkdir -p ../voxel
          curl -fsSL --retry 3 \
            -o voxel.tgz \
            "https://github.com/yanfengliu/voxel/archive/${VOXEL_COMMIT}.tar.gz"
          tar -xzf voxel.tgz \
            -C ../voxel \
            --strip-components=1
          rm -f voxel.tgz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build voxel
        shell: bash
        run: npm --prefix ../voxel ci

      - name: Install dependencies
        run: npm ci

      # Key the cache on the version `npm ci` ACTUALLY installed, read out of
      # node_modules rather than the `^1.59.1` range in package.json: Playwright
      # refuses to drive a browser build other than the one its own version
      # ships with, so a bump has to MISS this cache. The grep is there so a
      # read that returns "undefined" fails the step instead of quietly becoming
      # part of a cache key that then never matches anything again.
      - name: Read the installed Playwright version
        id: playwright
        shell: bash
        run: |
          version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # playwright.config.ts declares exactly ONE project — `chromium`, with no
      # `channel:` — so `devices['Desktop Chrome']` is a viewport/user-agent
      # preset, not a request for branded Chrome. The bundled chromium build is
      # the entire requirement; Firefox and WebKit are never launched, so they
      # are never downloaded. Its `launchOptions` ask for
      # `--use-angle=swiftshader`, i.e. software GL, which is what makes a
      # GPU-less runner viable at all.
      #
      # The apt-level system libraries live outside ~/.cache and so are never
      # restored by the cache; on a hit only those are missing.
      - name: Install Chromium and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the system libraries (Chromium came from the cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The exact command `npm run verify` runs, plus this job's shard, so this
      # leg and the local gate cannot drift apart on how the suite is invoked.
      # Its `pretest:browser` runs `npm run build`, which is what produces the
      # dist/ the config's globalSetup (verifyPreviewServesThisBuild) compares
      # against what the preview serves — that guard aborts the run rather than
      # measuring a stale or foreign bundle, and it works unchanged here because
      # Playwright starts the `vite preview` itself: nothing else holds
      # 127.0.0.1:4173 on a fresh runner, so `reuseExistingServer` has nothing
      # to reuse. npm passes the argument after `--` to `playwright test` only,
      # not to the pre-script.
      - name: Browser suite
        id: browser-suite
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          FORCE_COLOR: '0'

      # See the same step in `gates`: this shard's tests, from the report
      # tests/browser/helpers/durationBudgetReporter.ts writes.
      - name: Headroom under each test's time limit
        if: ${{ !cancelled() && steps.browser-suite.outcome != 'skipped' }}
        run: node scripts/test-time-headroom.mjs tmp/test-times/playwright.json

      # See the same step in `gates`, and scripts/ci-job-headroom.mjs.
      - name: Headroom under the job's time limit
        if: ${{ !cancelled() }}
        run: node scripts/ci-job-headroom.mjs --limit-minutes 45

      # `trace: 'retain-on-failure'` and `screenshot: 'only-on-failure'` write
      # into test-results/ only when a spec fails. A green run uploads nothing;
      # a red one is otherwise undiagnosable from here. The name carries the
      # shard and the attempt, because two uploads under one name in one run
      # are refused.
      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
