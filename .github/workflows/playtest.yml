name: playtest-corpus
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # aoe2's `file:../civ-engine` dep — see ci.yml. Check out + build the
      # public sibling engine so npm can resolve it.
      - name: Checkout civ-engine (sibling file: dependency)
        uses: actions/checkout@v4
        with:
          repository: yanfengliu/civ-engine
          ref: main
          path: __civ-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build civ-engine into ../civ-engine
        shell: bash
        run: |
          mv __civ-engine ../civ-engine
          cd ../civ-engine
          npm ci
          npm run build
      - run: npm ci
      - run: npm run playtest:corpus
      - name: Upload corpus output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: output/corpus/
      - name: Post SUMMARY.md to PR check
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const corpusDir = 'output/corpus';
            const dates = (fs.existsSync(corpusDir) ? fs.readdirSync(corpusDir) : []).sort();
            if (dates.length === 0) return;
            const summaryPath = path.join(corpusDir, dates[dates.length - 1], 'SUMMARY.md');
            if (!fs.existsSync(summaryPath)) {
              core.warning(`SUMMARY.md missing at ${summaryPath}; skipping comment.`);
              return;
            }
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const marker = '<!-- playtest-corpus -->';
            const body = `${marker}\n## Playtest corpus\n\n${summary}`;
            // Update existing comment if present so push events don't accumulate.
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const existing = await github.paginate(github.rest.issues.listComments, issue);
            const prior = existing.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
