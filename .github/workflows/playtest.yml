name: playtest-corpus
on:
  pull_request:
  # EVERY push to main runs the corpus, for the reason ci.yml gives: the
  # `on.push.paths` filter that used to sit here was cost control from when
  # Actions minutes were paid, and on a public repository standard runners cost
  # nothing (run 35976155109 billed 0 ms for 4.4 minutes). With the filter, a
  # change to the AI or the simulation reached this corpus only when a version
  # bump happened to ride the same push. tests/scripts/ciTriggers.test.ts fails
  # if this trigger filters its push to main again.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    # Sim-heavy deterministic corpus playtests; 60m headroom (see ci.yml note).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # aoe2 consumes the engine's PREBUILT dist (the engine CI packs it as the
      # rolling engine-dist release); it does not build the engine. See ci.yml.
      - name: Fetch the prebuilt civ-engine
        shell: bash
        run: |
          curl -fsSL -o civ-engine.tgz https://github.com/yanfengliu/civ-engine/releases/download/engine-dist/civ-engine.tgz
          mkdir -p ../civ-engine
          tar -xzf civ-engine.tgz -C ../civ-engine --strip-components=1
      - name: Fetch pinned voxel source
        shell: bash
        run: |
          VOXEL_COMMIT="$(tr -d '[:space:]' < .github/voxel-commit)"
          printf '%s\n' "$VOXEL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test ! -e ../voxel
          mkdir -p ../voxel
          # Relative paths on purpose, -C included: under Git-bash on Windows
          # GNU tar mangles a drive-lettered path, which kept every
          # windows-latest run red for two months.
          curl -fsSL --retry 3 \
            -o voxel.tgz \
            "https://github.com/yanfengliu/voxel/archive/${VOXEL_COMMIT}.tar.gz"
          tar -xzf voxel.tgz \
            -C ../voxel \
            --strip-components=1
          rm -f voxel.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build voxel
        shell: bash
        run: npm --prefix ../voxel ci
      - run: npm ci
      - run: npm run playtest:corpus
      - name: Upload corpus output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: output/corpus/
      - name: Post SUMMARY.md to PR check
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const corpusDir = 'output/corpus';
            const dates = (fs.existsSync(corpusDir) ? fs.readdirSync(corpusDir) : []).sort();
            if (dates.length === 0) return;
            const summaryPath = path.join(corpusDir, dates[dates.length - 1], 'SUMMARY.md');
            if (!fs.existsSync(summaryPath)) {
              core.warning(`SUMMARY.md missing at ${summaryPath}; skipping comment.`);
              return;
            }
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const marker = '<!-- playtest-corpus -->';
            const body = `${marker}\n## Playtest corpus\n\n${summary}`;
            // Update existing comment if present so push events don't accumulate.
            const issue = { ...context.repo, issue_number: context.payload.pull_request.number };
            const existing = await github.paginate(github.rest.issues.listComments, issue);
            const prior = existing.find(c => c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
